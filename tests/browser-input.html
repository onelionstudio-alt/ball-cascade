<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ball Cascade browser input checks</title><style>body{font:16px system-ui;background:#102027;color:#dcff80;margin:12px}button{padding:14px;margin:5px}canvas{display:block;width:min(100%,480px);aspect-ratio:16/9;background:#24343e;touch-action:none}pre{white-space:pre-wrap}</style><h1>Real input module · browser fixture</h1><p>Software-dispatched touch PointerEvents. Not a hardware touchscreen certification.</p><button id="run">Run touch pointer checks</button><canvas width="960" height="540"></canvas><pre id="output">Not run</pre><script type="module">
import {Engine} from '../src/engine.js';import {fresh} from '../src/save.js';import {bindInput} from '../src/input.js';
const c=document.querySelector('canvas'),out=document.querySelector('#output');
document.querySelector('#run').onclick=()=>{
 const e=new Engine(fresh()),r={selected:-1};bindInput(c,e,r);const box=c.getBoundingClientRect();
 const send=(type,x,y,id=21)=>c.dispatchEvent(new PointerEvent(type,{clientX:box.left+x*box.width/960,clientY:box.top+y*box.height/540,pointerId:id,pointerType:'touch',isPrimary:true,bubbles:true}));
 const checks=[];const ok=(name,value)=>{checks.push(`${value?'PASS':'FAIL'} ${name}`);if(!value)throw Error(name);};
 try{send('pointerdown',160,220);send('pointermove',480,250);ok('Touch drag maps scaled Canvas coordinates',Math.abs(e.modules[0].x-480)<.01&&Math.abs(e.modules[0].y-250)<.01);send('pointermove',700,400,22);ok('Other finger cannot steal drag',e.modules[0].x===480);send('pointercancel',480,250);send('pointermove',700,400);ok('Cancelled touch cannot keep moving module',e.modules[0].x===480);send('pointerdown',530,50);send('pointerup',530,50);ok('Touch tap aims emitter',Math.abs(e.aim-530)<.01);ok('Board prevents gesture scrolling',getComputedStyle(c).touchAction==='none');out.textContent=checks.join('\n');}catch(err){out.textContent=checks.join('\n')+'\n'+err;}
};
</script></html>
